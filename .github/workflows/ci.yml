name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only: the job builds and tests, and `actions/checkout` writes the token
    # into .git/config where every dependency build script could read it.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Stable, deliberately: nothing here needs nightly, and requiring it
          # would be an adoption barrier for a library other people build on.
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all -- --check

      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - run: cargo test --workspace --locked

      # No test may reach the network: `bundle add` is the only operation that
      # does, and it is exercised against local fixtures. This asserts the
      # endpoints stay confined to cellar-fetch, so CI can never start depending
      # on Meta's uptime.
      - name: no network outside cellar-fetch
        run: |
          if grep -rn 'facebook\.com\|web\.whatsapp\.com' \
              --include='*.rs' crates/*/src \
              | grep -v '^crates/cellar-fetch/src/lib.rs' \
              | grep -v 'archive_url_is_revision_and_platform'; then
            echo "network endpoints must stay inside cellar-fetch"
            exit 1
          fi

      # The two agent skills are one file behind a symlink; a copy would drift.
      - name: skill is a single source of truth
        run: |
          test -L .codex/skills/cellar
          diff -q .claude/skills/cellar/SKILL.md .codex/skills/cellar/SKILL.md

  msrv:
    name: msrv (1.95)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.95"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
      # The declared floor is a promise; check it instead of hoping.
      - run: cargo check --workspace --all-targets --locked
